packages:
  - "packages/*"
  # Parked source is retained, but excluded from recursive tasks and Changesets.
  - "!packages/community"
  - "!packages/sync"
auditConfig:
  ignoreCves:
    # adm-zip GHSA-vwc7-r8mq-g2x9 remains unpatched on leftover 0.5 paths;
    # resolvable copies are overridden to >=0.6.0.
    - CVE-2026-76845
    # Unpatched build/config and fixed-format logging paths; assessment and
    # removal conditions: spec/records/2026-10-11-plugin-test-unblock.md.
    - CVE-2026-93687
    - CVE-2026-97058

linkWorkspacePackages: true
# Hosts explicitly supply optional feature peers, including unpublished migration clients.
autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  # Match the Notes host's Turso 0.7.2 worker-runtime compatibility pins.
  "@napi-rs/wasm-runtime@1.0.7>@emnapi/core": "1.8.1"
  "@napi-rs/wasm-runtime@1.0.7>@emnapi/runtime": "1.8.1"
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": ">=1.31.0 <2"
  adm-zip@<0.6.0: ">=0.6.0"
  "body-parser@>=2.0.0 <2.4.0": ">=2.4.0 <3"
  "zod@>=4.0.0 <4.6.6": ">=4.6.6 <5"
  aria-query: "5.3.2"
  brace-expansion@>=4.0.0 <5.0.12: ">=5.0.12 <6"
  devalue@<=5.9.2: ">=5.9.3 <6"
  dompurify@<3.4.17: ">=3.4.17 <4"
  fast-uri@>=3.0.0 <3.1.9: ">=3.1.9 <4"
  hono@<4.13.7: ">=4.13.7 <5"
  ip-address@<=10.7.0: ">=10.7.1 <11"
  katex@>=0.11.0 <0.18.2: ">=0.18.2 <0.19"
  proxy-addr@>=1.1.0 <2.0.8: ">=2.0.8 <3"
  qs@>=2.2.5 <6.16.0: ">=6.16.0"
  qs@>=6.14.2 <=6.15.3: ">=6.16.0"
  sharp: ">=0.35.5 <0.36"
  source-map-js@>=1.0.0 <1.2.2: ">=1.2.2 <2"
patchedDependencies:
  bits-ui@2.19.5: patches/bits-ui@2.19.5.patch
