[package]
name = "lapis-plugin-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
description = "Transport-independent native first-party Lapis plugin algorithms"

[dependencies]
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
saphyr = { version = "=0.3.0", default-features = false }
ryu-js = "=1.0.2"
md5 = "=0.8.0"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
k256 = { version = "0.13", features = ["schnorr"] }
thiserror = "1"

[dev-dependencies]
proptest = "1"

[workspace]
