name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  prerequisite:
    runs-on: ubuntu-latest
    steps:
      - name: Report framework publication prerequisite
        run: |
          if [ "${{ vars.FRAMEWORK_PACKAGES_PUBLISHED }}" = "true" ]; then
            echo "Published framework packages are available."
          else
            echo "Validation remains intentionally deferred until the framework package publication gate completes."
          fi

  image-pin:
    runs-on: ubuntu-latest
    outputs:
      reference: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the verified dependency image
        id: image
        run: |
          set -euo pipefail
          reference="$(jq -er '.dependencies | select(.image and (.digest | test("^sha256:[a-f0-9]{64}$"))) | .image + "@" + .digest' .ci/images.json)"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  build-cache:
    needs:
      - prerequisite
      - image-pin
    if: vars.FRAMEWORK_PACKAGES_PUBLISHED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Populate signed remote build cache
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report build-cache result
        run: node scripts/report-turbo-cache.mjs --github-summary

  quality:
    needs:
      - build-cache
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: pnpm packages:check
      - run: pnpm spec:check
      - run: pnpm check:no-tailwind
      - name: Run package checks
        run: node scripts/run-turbo.mjs build check --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary

  unit:
    needs:
      - build-cache
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Run package unit tests
        run: node scripts/run-turbo.mjs build test --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: pnpm test:release

  storybook-static:
    needs:
      - build-cache
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Restore package builds
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: pnpm build-storybook

  storybook-interaction:
    needs:
      - build-cache
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Restore package builds
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: pnpm test:storybook

  release-artifacts:
    needs:
      - build-cache
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Restore package builds
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: pnpm packages:pack -- --already-built
      - run: pnpm plugin:build
      - run: pnpm plugin:verify
      - run: pnpm release:plan
      - uses: actions/upload-artifact@v7
        with:
          name: first-party-plugin-candidate-artifacts
          path: |
            .release/npm/*.tgz
            .release/npm/*.sha256
            .release/npm/manifest.json
            .release/plugins/**/*.lapis-plugin
            .release/plugins/**/*.sha256
            .release/release-plan.json
          if-no-files-found: error
          retention-days: 14

  validate:
    if: always()
    needs:
      - prerequisite
      - image-pin
      - build-cache
      - quality
      - unit
      - storybook-static
      - storybook-interaction
      - release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate blocking validation lanes
        env:
          PREREQUISITE: ${{ needs.prerequisite.result }}
          IMAGE_PIN: ${{ needs.image-pin.result }}
          BUILD_CACHE: ${{ needs.build-cache.result }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          STORYBOOK_STATIC: ${{ needs.storybook-static.result }}
          STORYBOOK_INTERACTION: ${{ needs.storybook-interaction.result }}
          RELEASE_ARTIFACTS: ${{ needs.release-artifacts.result }}
        run: |
          set -euo pipefail
          results=(
            "$PREREQUISITE"
            "$IMAGE_PIN"
            "$BUILD_CACHE"
            "$QUALITY"
            "$UNIT"
            "$STORYBOOK_STATIC"
            "$STORYBOOK_INTERACTION"
            "$RELEASE_ARTIFACTS"
          )
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "A required CI lane finished with: $result" >&2
              exit 1
            fi
          done
          echo "All blocking Lapis Plugins validation lanes passed."
