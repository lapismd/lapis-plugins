name: Publish approved plugin releases

on:
  workflow_dispatch:
    inputs:
      plugin_ai:
        description: Release @lapis-notes/ai
        required: true
        default: true
        type: boolean
      plugin_bases:
        description: Release @lapis-notes/bases
        required: true
        default: true
        type: boolean
      plugin_bookmarks:
        description: Release @lapis-notes/bookmarks
        required: true
        default: true
        type: boolean
      plugin_graph:
        description: Release @lapis-notes/graph
        required: true
        default: true
        type: boolean
      plugin_history:
        description: Release @lapis-notes/history
        required: true
        default: true
        type: boolean
      plugin_markdown:
        description: Release @lapis-notes/markdown
        required: true
        default: true
        type: boolean
      plugin_markdown_lint:
        description: Release @lapis-notes/markdown-lint
        required: true
        default: true
        type: boolean
      plugin_search:
        description: Release @lapis-notes/search
        required: true
        default: true
        type: boolean
      plugin_slides:
        description: Release @lapis-notes/slides
        required: true
        default: true
        type: boolean
      plugin_source_editor:
        description: Release @lapis-notes/source-editor
        required: true
        default: true
        type: boolean
      plugin_spellcheck:
        description: Release @lapis-notes/spellcheck
        required: true
        default: true
        type: boolean
      plugin_wordcount:
        description: Release @lapis-notes/wordcount
        required: true
        default: true
        type: boolean
      replace_existing_github_assets:
        description: Replace same-version GitHub assets only; never npm and blocked once registry-published
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  id-token: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LAPIS_PLUGINS_VALIDATION_RUNTIME: native

jobs:
  selection:
    if: vars.STATIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.selection.outputs.plugins }}
    steps:
      - name: Confirm the protected release gate
        env:
          FRAMEWORK_PACKAGES_PUBLISHED: ${{ vars.FRAMEWORK_PACKAGES_PUBLISHED }}
          FIRST_PUBLICATION_APPROVED: ${{ vars.FIRST_PUBLICATION_APPROVED }}
        run: |
          set -euo pipefail
          if [[ "$FRAMEWORK_PACKAGES_PUBLISHED" != "true" ]]; then
            echo "Framework packages must be published before plugin release." >&2
            exit 1
          fi
          if [[ "$FIRST_PUBLICATION_APPROVED" != "true" ]]; then
            echo "The first-publication repository gate is closed." >&2
            exit 1
          fi
      - name: Resolve selected plugins
        id: selection
        run: |
          set -euo pipefail
          plugin_names=(
            ai
            bases
            bookmarks
            graph
            history
            markdown
            markdown-lint
            search
            slides
            source-editor
            spellcheck
            wordcount
          )
          plugin_inputs=(
            "${{ inputs.plugin_ai }}"
            "${{ inputs.plugin_bases }}"
            "${{ inputs.plugin_bookmarks }}"
            "${{ inputs.plugin_graph }}"
            "${{ inputs.plugin_history }}"
            "${{ inputs.plugin_markdown }}"
            "${{ inputs.plugin_markdown_lint }}"
            "${{ inputs.plugin_search }}"
            "${{ inputs.plugin_slides }}"
            "${{ inputs.plugin_source_editor }}"
            "${{ inputs.plugin_spellcheck }}"
            "${{ inputs.plugin_wordcount }}"
          )
          selected_plugins=()
          for index in "${!plugin_names[@]}"; do
            if [[ "${plugin_inputs[$index]}" == "true" ]]; then
              selected_plugins+=("${plugin_names[$index]}")
            fi
          done
          if [[ "${#selected_plugins[@]}" -eq 0 ]]; then
            echo "Select at least one plugin to release." >&2
            exit 1
          fi
          plugin_list="$(IFS=,; echo "${selected_plugins[*]}")"
          echo "plugins=$plugin_list" >> "$GITHUB_OUTPUT"
          echo "Selected plugins: $plugin_list"

  image-pin:
    if: vars.STATIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      reference: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the verified dependency image
        id: image
        run: |
          set -euo pipefail
          reference="$(jq -er '.dependencies | select(.image and (.digest | test("^sha256:[a-f0-9]{64}$"))) | .image + "@" + .digest' .ci/images.json)"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  validate:
    if: vars.STATIC_RELEASE_ENABLED == 'true'
    needs: selection
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  static-publish:
    needs: [selection, validate, image-pin]
    if: vars.STATIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: first-publication
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Validate selected source and every shared release gate
        run: |
          set -euo pipefail
          pnpm spec:check
          pnpm check
          pnpm test
          pnpm test:release
          pnpm test:storybook
          pnpm build-storybook
          pnpm build
          pnpm packages:pack -- --already-built
          pnpm plugin:build
          pnpm plugin:verify
      - name: Prepare signed static candidates
        env:
          LAPIS_PLUGIN_RELEASE_KEY_ID: ${{ secrets.LAPIS_PLUGIN_RELEASE_KEY_ID }}
          LAPIS_PLUGIN_RELEASE_PRIVATE_KEY: ${{ secrets.LAPIS_PLUGIN_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/lapis-static-release.pem"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          node scripts/write-static-signing-key.mjs "$key_file"
          export LAPIS_PLUGIN_RELEASE_PRIVATE_KEY_FILE="$key_file"
          node scripts/create-static-release-plan.mjs --production --plugins "${{ needs.selection.outputs.plugins }}"
      - uses: actions/upload-artifact@v7
        with:
          name: signed-static-candidate-${{ github.run_id }}
          path: |
            .release/npm/*.tgz
            .release/npm/*.sha256
            .release/npm/manifest.json
            .release/plugins/**/*.lapis-plugin
            .release/plugins/**/*.lapis-plugin.sha256
            .release/release-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Skip published npm versions and create missing GitHub releases
        run: |
          set -euo pipefail
          args=(--plugins "${{ needs.selection.outputs.plugins }}")
          if [[ "${{ inputs.replace_existing_github_assets }}" == "true" ]]; then
            args+=(--replace-github-assets)
          fi
          pnpm release:publish-approved -- "${args[@]}"
        env:
          FIRST_PUBLICATION_APPROVED: "true"
          LAPIS_PUBLICATION_APPROVED: "true"
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
      - name: Create registry GitHub App token
        id: registry-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.LAPIS_REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_REGISTRY_APP_PRIVATE_KEY }}
          owner: lapismd
          repositories: plugin-registry
          permission-contents: write
      - name: Request verified static registry updates
        run: node scripts/dispatch-static-release.mjs --plugins "${{ needs.selection.outputs.plugins }}"
        env:
          LAPIS_PUBLICATION_APPROVED: "true"
          REGISTRY_GITHUB_TOKEN: ${{ steps.registry-app.outputs.token }}
