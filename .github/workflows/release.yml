name: Publish approved plugin releases

on:
  workflow_dispatch:
    inputs:
      plugin_ai:
        description: Release @lapis-notes/ai
        required: true
        default: true
        type: boolean
      plugin_bases:
        description: Release @lapis-notes/bases
        required: true
        default: true
        type: boolean
      plugin_bookmarks:
        description: Release @lapis-notes/bookmarks
        required: true
        default: true
        type: boolean
      plugin_community:
        description: Release @lapis-notes/community
        required: true
        default: true
        type: boolean
      plugin_graph:
        description: Release @lapis-notes/graph
        required: true
        default: true
        type: boolean
      plugin_history:
        description: Release @lapis-notes/history
        required: true
        default: true
        type: boolean
      plugin_markdown:
        description: Release @lapis-notes/markdown
        required: true
        default: true
        type: boolean
      plugin_markdown_lint:
        description: Release @lapis-notes/markdown-lint
        required: true
        default: true
        type: boolean
      plugin_search:
        description: Release @lapis-notes/search
        required: true
        default: true
        type: boolean
      plugin_slides:
        description: Release @lapis-notes/slides
        required: true
        default: true
        type: boolean
      plugin_source_editor:
        description: Release @lapis-notes/source-editor
        required: true
        default: true
        type: boolean
      plugin_spellcheck:
        description: Release @lapis-notes/spellcheck
        required: true
        default: true
        type: boolean
      plugin_wordcount:
        description: Release @lapis-notes/wordcount
        required: true
        default: true
        type: boolean
      replace_existing_github_assets:
        description: Replace same-version GitHub assets only; never npm and blocked once registry-published
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  id-token: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.selection.outputs.plugins }}
    steps:
      - name: Confirm the protected release gate
        env:
          FRAMEWORK_PACKAGES_PUBLISHED: ${{ vars.FRAMEWORK_PACKAGES_PUBLISHED }}
          FIRST_PUBLICATION_APPROVED: ${{ vars.FIRST_PUBLICATION_APPROVED }}
        run: |
          set -euo pipefail
          if [[ "$FRAMEWORK_PACKAGES_PUBLISHED" != "true" ]]; then
            echo "Framework packages must be published before plugin release." >&2
            exit 1
          fi
          if [[ "$FIRST_PUBLICATION_APPROVED" != "true" ]]; then
            echo "The first-publication repository gate is closed." >&2
            exit 1
          fi
      - name: Resolve selected plugins
        id: selection
        run: |
          set -euo pipefail
          plugin_names=(
            ai
            bases
            bookmarks
            community
            graph
            history
            markdown
            markdown-lint
            search
            slides
            source-editor
            spellcheck
            wordcount
          )
          plugin_inputs=(
            "${{ inputs.plugin_ai }}"
            "${{ inputs.plugin_bases }}"
            "${{ inputs.plugin_bookmarks }}"
            "${{ inputs.plugin_community }}"
            "${{ inputs.plugin_graph }}"
            "${{ inputs.plugin_history }}"
            "${{ inputs.plugin_markdown }}"
            "${{ inputs.plugin_markdown_lint }}"
            "${{ inputs.plugin_search }}"
            "${{ inputs.plugin_slides }}"
            "${{ inputs.plugin_source_editor }}"
            "${{ inputs.plugin_spellcheck }}"
            "${{ inputs.plugin_wordcount }}"
          )
          selected_plugins=()
          for index in "${!plugin_names[@]}"; do
            if [[ "${plugin_inputs[$index]}" == "true" ]]; then
              selected_plugins+=("${plugin_names[$index]}")
            fi
          done
          if [[ "${#selected_plugins[@]}" -eq 0 ]]; then
            echo "Select at least one plugin to release." >&2
            exit 1
          fi
          plugin_list="$(IFS=,; echo "${selected_plugins[*]}")"
          echo "plugins=$plugin_list" >> "$GITHUB_OUTPUT"
          echo "Selected plugins: $plugin_list"

  image-pin:
    runs-on: ubuntu-latest
    outputs:
      reference: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the verified dependency image
        id: image
        run: |
          set -euo pipefail
          reference="$(jq -er '.dependencies | select(.image and (.digest | test("^sha256:[a-f0-9]{64}$"))) | .image + "@" + .digest' .ci/images.json)"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  validate:
    needs: selection
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  production-candidate:
    needs:
      - selection
      - validate
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Restore validated package builds
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Pack npm candidates from validated builds
        run: pnpm packages:pack -- --already-built
      - name: Bind release time to the source commit
        run: echo "LAPIS_RELEASED_AT=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Build deterministic plugin payloads
        run: pnpm plugin:build
      - name: Verify production candidate
        run: |
          set -euo pipefail
          pnpm plugin:verify
          pnpm release:plan -- --production
          jq -e --arg source "$GITHUB_SHA" \
            '.production == true and .generatedFrom == $source and (.releases | length == 13) and all(.releases[]; .sourceCommit == $source)' \
            .release/release-plan.json >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: production-plugin-candidate-${{ github.run_id }}
          path: |
            .release/npm/*.tgz
            .release/npm/*.sha256
            .release/npm/manifest.json
            .release/plugins/**/*.payload.zip
            .release/plugins/**/*.sha256
            .release/plugins/**/release.json
            .release/plugins/**/*.manifest.json
            .release/plugins/**/*.publisher-request.json
            .release/release-plan.json
          if-no-files-found: error
          retention-days: 7

  publisher-sign:
    needs:
      - selection
      - production-candidate
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: read
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v8
        with:
          name: production-plugin-candidate-${{ github.run_id }}
          path: .release
      - name: Reverify the publisher candidate
        run: |
          set -euo pipefail
          candidate_plan="$RUNNER_TEMP/production-release-plan.json"
          cp .release/release-plan.json "$candidate_plan"
          LAPIS_RELEASED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          export LAPIS_RELEASED_AT
          echo "LAPIS_RELEASED_AT=$LAPIS_RELEASED_AT" >> "$GITHUB_ENV"
          pnpm plugin:verify
          pnpm release:plan -- --production
          cmp "$candidate_plan" .release/release-plan.json
      - name: Request publisher Nostr signatures
        run: pnpm release:nostr -- --role publisher --plugins "${{ needs.selection.outputs.plugins }}"
        env:
          LAPIS_NOSTR_SIGNER_URL: ${{ vars.LAPIS_NOSTR_SIGNER_URL }}
          LAPIS_NOSTR_SIGNER_AUDIENCE: ${{ vars.LAPIS_NOSTR_SIGNER_AUDIENCE }}
          LAPIS_NOSTR_PUBLISHER_PUBKEY: ${{ vars.LAPIS_NOSTR_PUBLISHER_PUBKEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: publisher-signed-plugin-candidate-${{ github.run_id }}
          path: .release
          if-no-files-found: error
          retention-days: 7

  curator-sign:
    needs:
      - selection
      - publisher-sign
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nostr-curation
    permissions:
      contents: read
      id-token: write
      packages: read
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v8
        with:
          name: publisher-signed-plugin-candidate-${{ github.run_id }}
          path: .release
      - name: Reverify the approved candidate
        run: |
          set -euo pipefail
          candidate_plan="$RUNNER_TEMP/production-release-plan.json"
          cp .release/release-plan.json "$candidate_plan"
          LAPIS_RELEASED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          export LAPIS_RELEASED_AT
          echo "LAPIS_RELEASED_AT=$LAPIS_RELEASED_AT" >> "$GITHUB_ENV"
          pnpm plugin:verify
          pnpm release:plan -- --production
          cmp "$candidate_plan" .release/release-plan.json
      - name: Request the curator decision
        run: |
          pnpm release:nostr -- --role curator --plugins "${{ needs.selection.outputs.plugins }}"
          pnpm release:nostr:verify -- --plugins "${{ needs.selection.outputs.plugins }}"
        env:
          LAPIS_NOSTR_SIGNER_URL: ${{ vars.LAPIS_NOSTR_SIGNER_URL }}
          LAPIS_NOSTR_SIGNER_AUDIENCE: ${{ vars.LAPIS_NOSTR_SIGNER_AUDIENCE }}
          LAPIS_NOSTR_CURATOR_PUBKEY: ${{ vars.LAPIS_NOSTR_CURATOR_PUBKEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: curated-plugin-candidate-${{ github.run_id }}
          path: .release
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - selection
      - validate
      - curator-sign
      - image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: read
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v8
        with:
          name: curated-plugin-candidate-${{ github.run_id }}
          path: .release
      - name: Reverify the downloaded production candidate
        run: |
          set -euo pipefail
          candidate_plan="$RUNNER_TEMP/production-release-plan.json"
          cp .release/release-plan.json "$candidate_plan"
          LAPIS_RELEASED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          export LAPIS_RELEASED_AT
          pnpm plugin:verify
          pnpm release:plan -- --production
          cmp "$candidate_plan" .release/release-plan.json
          pnpm release:nostr:verify -- --plugins "${{ needs.selection.outputs.plugins }}"
          jq -e --arg source "$GITHUB_SHA" \
            '.production == true and .generatedFrom == $source and (.releases | length == 13) and all(.releases[]; .sourceCommit == $source)' \
            .release/release-plan.json >/dev/null
      - name: Publish npm and GitHub assets
        shell: bash
        run: |
          set -euo pipefail
          args=(--plugins "${{ needs.selection.outputs.plugins }}")
          if [[ "${{ inputs.replace_existing_github_assets }}" == "true" ]]; then
            args+=(--replace-github-assets)
          fi
          pnpm release:publish-approved -- "${args[@]}"
        env:
          FIRST_PUBLICATION_APPROVED: "true"
          LAPIS_PUBLICATION_APPROVED: "true"
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
      - name: Publish signed events and wait for relay quorum
        run: pnpm release:nostr -- --role publish --plugins "${{ needs.selection.outputs.plugins }}"
        env:
          LAPIS_NOSTR_SIGNER_URL: ${{ vars.LAPIS_NOSTR_SIGNER_URL }}
          LAPIS_NOSTR_SIGNER_AUDIENCE: ${{ vars.LAPIS_NOSTR_SIGNER_AUDIENCE }}
          LAPIS_NOSTR_RELAY_QUORUM: ${{ vars.LAPIS_NOSTR_RELAY_QUORUM }}
